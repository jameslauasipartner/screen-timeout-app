plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace "com.example.screentimeout"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.screentimeout"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
}
